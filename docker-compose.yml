# Ambiente de desenvolvimento local do La Carte. Só dev: nada aqui vai para produção.
#
# Sistema completo:  docker compose up -d
#   Postgres + MinIO + painel (http://localhost:8000/admin e /plataforma)
#   + worker da fila + PWA (http://localhost:5173/bar-do-tonho).
#   A primeira subida demora (build da imagem, composer install, npm ci).
#   Acompanhar:      docker compose logs -f painel-setup painel painel-worker cardapio
# Só infra:          docker compose up -d postgres minio minio-init
#   (para rodar a suíte do painel e a PWA no host, como antes)
# Parar:             docker compose down        (mantém os dados)
# Zerar:             docker compose down -v     (apaga banco, bucket, vendor e
#                                                node_modules; tudo volta do zero)
#
# Portas no host (só 127.0.0.1): 8000 painel · 5173 PWA · 5433 Postgres
# · 9000 MinIO (API) · 9001 MinIO (console). Pare `php artisan serve` e
# `npm run dev` do host antes de subir o sistema completo, senão a porta conflita.
#
# O painel no container NUNCA lê o painel/.env da máquina (que pode apontar para
# produção): docker/painel/.env.docker é montado por cima dele. Se painel/.env
# não existir, o Docker cria um arquivo vazio no lugar (está no .gitignore); o
# `php artisan` do host continua precisando do próprio .env.

# Configuração comum aos três serviços do painel (setup, web e worker).
x-painel: &painel
  build: ./docker/painel
  image: la-carte-painel-dev
  volumes:
    - ./painel:/var/www/html
    # Por cima do .env da máquina: o container só enxerga valores de dev.
    - ./docker/painel/.env.docker:/var/www/html/.env:ro
    # vendor/ fora do disco do Windows: mais rápido e não mistura com o do host.
    - painel_vendor:/var/www/html/vendor
    # O symlink public/storage do host aponta para um caminho do Windows, que não
    # existe no Linux. Montar a pasta real por cima dele faz /storage funcionar
    # sem rodar storage:link (que reescreveria o symlink no disco do host).
    - ./painel/storage/app/public:/var/www/html/public/storage
    # APP_KEY de dev, gerada pelo painel-setup na primeira subida (nunca no git).
    - painel_secrets:/secrets
  environment:
    # Caches do Laravel fora de bootstrap/cache/, que é compartilhado com o host:
    # um config:cache feito no host (com o .env de produção) seria lido aqui.
    APP_CONFIG_CACHE: /tmp/laravel/config.php
    APP_ROUTES_CACHE: /tmp/laravel/routes.php
    APP_EVENTS_CACHE: /tmp/laravel/events.php
    APP_PACKAGES_CACHE: /tmp/laravel/packages.php
    APP_SERVICES_CACHE: /tmp/laravel/services.php

services:
  postgres:
    # Major fixada = a mesma de produção. Minor (18.x) recebe só correções.
    image: postgres:18
    container_name: la-carte-postgres
    restart: unless-stopped
    environment:
      # Credenciais APENAS de dev. Este usuário é superuser do Postgres.
      POSTGRES_USER: la_carte
      POSTGRES_PASSWORD: la_carte_dev
      POSTGRES_DB: la_carte
    ports:
      # host:container. Só na máquina local (127.0.0.1), não fica exposto na rede.
      # 5433 no host porque a 5432 já é usada pelo Postgres de outro projeto.
      - "127.0.0.1:5433:5432"
    volumes:
      # A partir do Postgres 18, a imagem espera o volume em /var/lib/postgresql
      # (e não mais em /var/lib/postgresql/data).
      - pgdata:/var/lib/postgresql
      # Scripts rodados só na criação do banco (volume vazio): papéis e banco de teste.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U la_carte -d la_carte"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage S3-compatível: faz o papel do R2 em dev.
  # Existe para testar os cache headers dos snapshots de verdade. O disco local
  # do Laravel não guarda Cache-Control; o S3/R2 guarda como metadado do objeto
  # e devolve como header, que é o que o MinIO também faz.
  # Imagem do quay.io com release fixada: o MinIO saiu do Docker Hub e o
  # community edition está em modo de manutenção. Só a API S3 importa aqui.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: la-carte-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Credenciais APENAS de dev.
      MINIO_ROOT_USER: la_carte
      MINIO_ROOT_PASSWORD: la_carte_dev
    ports:
      - "127.0.0.1:9000:9000" # API S3 (onde os arquivos são servidos)
      - "127.0.0.1:9001:9001" # console web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Roda uma vez e sai: cria o bucket e libera leitura anônima, como um bucket
  # público do R2 atrás do CDN. Escrita continua exigindo credencial.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: la-carte-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 la_carte la_carte_dev &&
      mc mb --ignore-existing local/la-carte &&
      mc anonymous set download local/la-carte
      "
    restart: "no"

  # Roda a cada subida e sai: composer install, migrations e seed (só em banco
  # vazio). Se falhar, web e worker não sobem e o erro fica no log deste serviço.
  painel-setup:
    <<: *painel
    container_name: la-carte-painel-setup
    command: ["sh", "/setup.sh"]
    volumes:
      - ./painel:/var/www/html
      - ./docker/painel/.env.docker:/var/www/html/.env:ro
      - painel_vendor:/var/www/html/vendor
      - ./docker/painel/setup.sh:/setup.sh:ro
      - painel_secrets:/secrets
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  # Painel web. O servidor embutido relê o PHP a cada request: editar e recarregar.
  # --no-reload: sem ele o serve descarta variáveis de ambiente (APP_KEY inclusa)
  # ao subir o processo filho. Mudou o .env.docker? `docker compose restart painel`.
  painel:
    <<: *painel
    container_name: la-carte-painel
    command: ["sh", "-c", "export APP_KEY=\"$$(cat /secrets/app_key)\" && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      painel-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # Worker da fila (publicação e imagens). queue:listen e não queue:work:
  # o listen sobe um processo por job e sempre usa o código atual.
  painel-worker:
    <<: *painel
    container_name: la-carte-painel-worker
    command: ["sh", "-c", "export APP_KEY=\"$$(cat /secrets/app_key)\" && exec php artisan queue:listen --tries=3"]
    depends_on:
      painel-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # PWA do cardápio (Vite dev server).
  cardapio:
    image: node:24
    container_name: la-carte-cardapio
    working_dir: /app
    # npm ci só quando o package-lock.json mudou desde a última instalação.
    command:
      - sh
      - -c
      - |
        set -e
        hash=$$(sha1sum package-lock.json | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$hash" ]; then
          echo "[cardapio] npm ci"
          npm ci
          echo "$$hash" > node_modules/.lock-hash
        fi
        exec npx vite --host 0.0.0.0 --port 5173
    environment:
      # Ganha de cardapio/.env.local: a PWA do stack sempre lê o MinIO local.
      VITE_SNAPSHOT_BASE_URL: http://127.0.0.1:9000/la-carte
      # Bind mount do Windows não propaga eventos de arquivo: watcher por polling.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./cardapio:/app
      # Binários nativos do Vite são por sistema: os do Windows não rodam aqui.
      - cardapio_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  painel_vendor:
  painel_secrets:
  cardapio_node_modules:
